<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Transaction Table</title>
<script src="https://cdn.jsdelivr.net/gh/tableau/extensions-api/lib/tableau.extensions.1.latest.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --font:'Inter',-apple-system,sans-serif;
  --mono:'JetBrains Mono',monospace;
  --ease:cubic-bezier(.16,1,.3,1);
  --ease2:cubic-bezier(.22,.68,0,1.1);
  --bg:    #f1f5f9;
  --card:  rgba(255,255,255,.88);
  --bdr:   rgba(15,23,42,.08);
  --bdr2:  rgba(15,23,42,.05);
  --surf:  rgba(248,250,252,.8);
  --t1:    #0f172a;
  --t2:    #1e293b;
  --t3:    #475569;
  --t4:    #94a3b8;
  --t5:    #cbd5e1;
  --ac:    #2563eb;
  --ac-l:  rgba(37,99,235,.08);
  --ac-b:  rgba(37,99,235,.18);
  --pos:   #15803d;
  --neg:   #b91c1c;
  --pos-b: rgba(21,128,61,.09);
  --neg-b: rgba(185,28,28,.09);
  --row-h: rgba(37,99,235,.035);
  --row-s: rgba(37,99,235,.08);
  --dd-bg: #ffffff;
  --dd-sh: 0 8px 32px rgba(15,23,42,.14),0 2px 8px rgba(15,23,42,.06);
}

html,body{
  width:100%;height:100%;
  background:var(--bg);
  font-family:var(--font);
  display:flex;align-items:stretch;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  color:var(--t2);
}
#app{width:100%;height:100%;display:flex;flex-direction:column;}

/* ════════════════════════════════
   SHELL
════════════════════════════════ */
.shell{
  flex:1;margin:8px;
  background:var(--card);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-radius:20px;
  border:1px solid rgba(255,255,255,.75);
  box-shadow:0 2px 8px rgba(15,23,42,.05),0 12px 36px rgba(15,23,42,.09),inset 0 1px 0 rgba(255,255,255,.9);
  display:flex;flex-direction:column;overflow:hidden;
  position:relative;
  animation:shellIn .45s var(--ease) both;
}
@keyframes shellIn{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}

/* ════════════════════════════════
   TOP BAR — title + search + filter buttons
════════════════════════════════ */
.topbar{
  display:flex;align-items:center;
  gap:8px;padding:11px 14px 10px;
  border-bottom:1px solid var(--bdr2);
  flex-shrink:0;position:relative;z-index:50;
  flex-wrap:wrap;
}
.tb-title{
  font-size:12.5px;font-weight:700;color:var(--t1);
  letter-spacing:-.25px;white-space:nowrap;flex-shrink:0;
}
.tb-count{
  font-size:9px;font-weight:600;color:var(--ac);
  background:var(--ac-l);border:0.5px solid var(--ac-b);
  padding:2px 8px;border-radius:99px;white-space:nowrap;flex-shrink:0;
}
.tb-spacer{flex:1;}

/* search */
.srch{
  position:relative;display:flex;align-items:center;
  flex:1;min-width:140px;max-width:240px;
}
.srch-ic{
  position:absolute;left:9px;color:var(--t4);pointer-events:none;
  display:flex;align-items:center;
}
.srch-ic svg{width:13px;height:13px;}
#srch-inp{
  width:100%;height:30px;padding:0 30px 0 30px;
  border-radius:9px;border:1px solid var(--bdr);
  background:rgba(255,255,255,.7);
  color:var(--t1);font-size:11px;font-weight:500;
  font-family:var(--font);outline:none;
  transition:border-color .15s,box-shadow .15s,background .15s;
}
#srch-inp::placeholder{color:var(--t5);}
#srch-inp:focus{border-color:rgba(37,99,235,.4);box-shadow:0 0 0 3px rgba(37,99,235,.08);background:#fff;}
.srch-clear{
  position:absolute;right:8px;
  width:16px;height:16px;border-radius:50%;
  background:var(--t5);border:none;cursor:pointer;
  display:none;align-items:center;justify-content:center;
  color:#fff;font-size:9px;font-weight:700;
  transition:background .14s;
}
.srch-clear:hover{background:var(--t4);}
.srch-clear.vis{display:flex;}

/* ── FILTER BUTTONS — each opens a dropdown ── */
.flt-group{
  display:flex;align-items:center;gap:4px;flex-shrink:0;
}
.flt-btn{
  position:relative;
  display:inline-flex;align-items:center;gap:4px;
  height:30px;padding:0 11px;
  border-radius:9px;
  border:1px solid var(--bdr);
  background:rgba(255,255,255,.7);
  color:var(--t3);font-size:11px;font-weight:500;
  font-family:var(--font);cursor:pointer;
  transition:all .15s;white-space:nowrap;
  user-select:none;
}
.flt-btn:hover{border-color:var(--ac-b);color:var(--t1);background:rgba(255,255,255,.9);}
.flt-btn.active{
  border-color:var(--ac-b);color:var(--ac);
  background:var(--ac-l);font-weight:600;
}
.flt-btn .chv{
  font-size:8px;opacity:.5;
  transition:transform .2s var(--ease);
}
.flt-btn.open .chv{transform:rotate(180deg);}
/* active dot */
.flt-btn .act-dot{
  width:5px;height:5px;border-radius:50%;
  background:var(--ac);display:none;flex-shrink:0;
}
.flt-btn.active .act-dot{display:block;}

/* ── DROPDOWN PANEL ── */
.dd{
  position:absolute;
  top:calc(100% + 5px);
  left:0;
  min-width:220px;
  max-width:300px;
  background:var(--dd-bg);
  border-radius:14px;
  border:1px solid rgba(15,23,42,.09);
  box-shadow:var(--dd-sh);
  z-index:200;
  overflow:hidden;
  display:none;
  flex-direction:column;
  animation:ddIn .18s var(--ease) both;
}
.dd.open{display:flex;}
@keyframes ddIn{
  from{opacity:0;transform:translateY(-6px) scale(.97)}
  to{opacity:1;transform:none}
}
/* search within dropdown */
.dd-srch{
  padding:8px 10px 6px;
  border-bottom:1px solid var(--bdr2);
  flex-shrink:0;
}
.dd-srch input{
  width:100%;height:28px;padding:0 10px;
  border-radius:7px;border:1px solid var(--bdr);
  background:var(--surf);
  color:var(--t1);font-size:10.5px;font-family:var(--font);
  outline:none;
  transition:border-color .14s,box-shadow .14s;
}
.dd-srch input:focus{border-color:var(--ac-b);box-shadow:0 0 0 2px rgba(37,99,235,.07);}
.dd-srch input::placeholder{color:var(--t5);}
/* list */
.dd-list{
  overflow-y:auto;max-height:200px;
  padding:4px 0;
}
.dd-list::-webkit-scrollbar{width:4px;}
.dd-list::-webkit-scrollbar-track{background:transparent;}
.dd-list::-webkit-scrollbar-thumb{background:rgba(15,23,42,.1);border-radius:99px;}
/* item */
.dd-item{
  display:flex;align-items:center;gap:9px;
  padding:6px 12px;cursor:pointer;
  transition:background .12s;
  user-select:none;
}
.dd-item:hover{background:var(--ac-l);}
.dd-item.checked{background:rgba(37,99,235,.06);}
.dd-cb{
  width:15px;height:15px;border-radius:4px;
  border:1.5px solid var(--t5);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  transition:all .14s;background:#fff;
}
.dd-item.checked .dd-cb{
  background:var(--ac);border-color:var(--ac);
}
.dd-cb svg{width:9px;height:9px;display:none;}
.dd-item.checked .dd-cb svg{display:block;}
.dd-label{
  font-size:11px;font-weight:500;color:var(--t2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  flex:1;font-family:var(--mono);
}
.dd-count{
  font-size:9px;font-weight:600;color:var(--t4);
  flex-shrink:0;
}
/* footer */
.dd-foot{
  display:flex;align-items:center;justify-content:space-between;
  padding:7px 12px;border-top:1px solid var(--bdr2);
  flex-shrink:0;
}
.dd-sel-count{font-size:9.5px;font-weight:600;color:var(--ac);}
.dd-clear{
  font-size:9.5px;font-weight:600;color:var(--t4);
  cursor:pointer;transition:color .14s;
  background:none;border:none;font-family:var(--font);
}
.dd-clear:hover{color:var(--neg);}

/* clear all button */
.clear-all-btn{
  height:30px;padding:0 11px;
  border-radius:9px;border:1px solid var(--bdr);
  background:rgba(255,255,255,.7);
  color:var(--t4);font-size:11px;font-weight:500;
  font-family:var(--font);cursor:pointer;
  display:flex;align-items:center;gap:4px;
  transition:all .15s;white-space:nowrap;
}
.clear-all-btn:hover{border-color:rgba(185,28,28,.2);color:var(--neg);background:rgba(185,28,28,.05);}
.clear-all-btn svg{width:11px;height:11px;}

/* ── ACTIVE FILTER TAGS row ── */
.tags-row{
  display:flex;align-items:center;gap:5px;
  padding:0 14px 8px;
  flex-wrap:wrap;
  flex-shrink:0;
}
.tags-row:empty{display:none;}
.tag{
  display:inline-flex;align-items:center;gap:4px;
  font-size:9.5px;font-weight:600;
  padding:2px 8px;border-radius:99px;
  border:0.5px solid var(--ac-b);
  background:var(--ac-l);color:var(--ac);
  white-space:nowrap;
  animation:tagIn .14s var(--ease) both;
}
@keyframes tagIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.tag.cc{
  border-color:rgba(124,58,237,.2);
  background:rgba(124,58,237,.08);color:#6d28d9;
}
.tag-x{
  cursor:pointer;opacity:.6;font-size:9px;
  transition:opacity .1s;background:none;border:none;
  color:inherit;padding:0;font-family:var(--font);
}
.tag-x:hover{opacity:1;}

/* ════════════════════════════════
   TABLE HEADER
════════════════════════════════ */
.tbl-head{
  display:grid;
  grid-template-columns:var(--tcols);
  padding:0 14px;
  border-bottom:1.5px solid var(--bdr);
  flex-shrink:0;
  background:rgba(248,250,252,.6);
  position:relative;z-index:2;
}
.th{
  padding:9px 8px 8px;
  display:flex;align-items:center;gap:5px;
  font-size:8px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;
  color:var(--t4);cursor:pointer;
  user-select:none;white-space:nowrap;
  transition:color .14s;
}
.th:hover{color:var(--t2);}
.th.sorted{color:var(--ac);}
.th.r{justify-content:flex-end;}
.sort-ic{
  display:inline-flex;flex-direction:column;gap:1px;
  opacity:.35;transition:opacity .14s;flex-shrink:0;
}
.th:hover .sort-ic,.th.sorted .sort-ic{opacity:1;}
.sort-ic svg{width:8px;height:5px;}

/* ════════════════════════════════
   SCROLLABLE TABLE BODY
════════════════════════════════ */
.tbl-body{
  flex:1;overflow-y:auto;overflow-x:hidden;
  position:relative;
}
.tbl-body::-webkit-scrollbar{width:5px;}
.tbl-body::-webkit-scrollbar-track{background:rgba(15,23,42,.02);}
.tbl-body::-webkit-scrollbar-thumb{background:rgba(15,23,42,.1);border-radius:99px;}
.tbl-body::-webkit-scrollbar-thumb:hover{background:rgba(15,23,42,.2);}

/* zebra stripe */
.tr{
  display:grid;
  grid-template-columns:var(--tcols);
  padding:0 14px;
  border-bottom:1px solid var(--bdr2);
  cursor:pointer;
  transition:background .1s;
  position:relative;
}
.tr:last-child{border-bottom:none;}
.tr:nth-child(even){background:rgba(248,250,252,.5);}
.tr:hover{background:var(--row-h);}
.tr.selected{
  background:var(--row-s);
  box-shadow:inset 2.5px 0 0 var(--ac);
}
.tr.selected:nth-child(even){background:var(--row-s);}
/* row enter animation */
.tr{animation:rowIn .16s var(--ease) both;}
@keyframes rowIn{from{opacity:0;transform:translateX(-4px)}to{opacity:1;transform:none}}

/* ── CELLS ── */
.td{
  padding:8px 8px;
  display:flex;align-items:center;
  font-size:11px;font-weight:500;
  color:var(--t2);
  overflow:hidden;white-space:nowrap;
  min-width:0;
}
.td.r{justify-content:flex-end;}
.td.mono{font-family:var(--mono);font-size:10.5px;}

/* account badge */
.acc-pill{
  display:inline-flex;align-items:center;
  background:rgba(37,99,235,.07);
  border:0.5px solid rgba(37,99,235,.15);
  border-radius:7px;padding:2px 8px;
  font-family:var(--mono);font-size:10px;font-weight:600;
  color:#1d4ed8;letter-spacing:-.01em;
  white-space:nowrap;max-width:100%;
  overflow:hidden;text-overflow:ellipsis;
}

/* cost centre badge */
.cc-pill{
  display:inline-flex;align-items:center;
  background:rgba(109,40,217,.07);
  border:0.5px solid rgba(109,40,217,.16);
  border-radius:7px;padding:2px 8px;
  font-family:var(--mono);font-size:10px;font-weight:600;
  color:#5b21b6;letter-spacing:-.01em;
  white-space:nowrap;max-width:100%;
  overflow:hidden;text-overflow:ellipsis;
}

/* amount */
.amt-pos{color:var(--pos);font-weight:700;font-family:var(--mono);font-size:10.5px;}
.amt-neg{color:var(--neg);font-weight:700;font-family:var(--mono);font-size:10.5px;}
.amt-zero{color:var(--t4);font-family:var(--mono);font-size:10.5px;}

/* date */
.td-date{color:var(--t3);font-size:10.5px;font-variant-numeric:tabular-nums;}

/* reason — truncated */
.td-reason{
  color:var(--t3);font-size:10.5px;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
  display:block;width:100%;
}

/* ── EMPTY ── */
#empty-state{
  display:none;flex:1;
  align-items:center;justify-content:center;
  flex-direction:column;gap:8px;padding:32px;
}
.emp-icon{font-size:26px;opacity:.35;}
.emp-txt{font-size:11.5px;font-weight:600;color:var(--t3);}
.emp-sub{font-size:10px;color:var(--t5);text-align:center;}

/* ── LOADING ── */
#loading-state{
  display:flex;flex:1;
  align-items:center;justify-content:center;
  flex-direction:column;gap:10px;
}
.spinner{
  width:24px;height:24px;
  border:2.5px solid var(--bdr);
  border-top-color:var(--ac);
  border-radius:50%;animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-txt{font-size:10.5px;color:var(--t4);font-weight:500;}

/* ════════════════════════════════
   FOOTER
════════════════════════════════ */
.ftr{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 14px 10px;
  border-top:1px solid var(--bdr2);
  flex-shrink:0;gap:10px;flex-wrap:wrap;
  background:rgba(248,250,252,.5);
}
.ftr-l{display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
.ftr-stat{font-size:9.5px;color:var(--t3);white-space:nowrap;}
.ftr-stat b{color:var(--t1);font-weight:700;}
.ftr-hint{font-size:8.5px;color:var(--t5);}
</style>
</head>
<body>
<div id="app">
<div class="shell">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="tb-title">Transaction Detail</div>
    <div class="tb-count" id="tb-count">—</div>
    <div class="tb-spacer"></div>

    <!-- Search -->
    <div class="srch">
      <div class="srch-ic">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="6.5" cy="6.5" r="4.5"/><path d="M11 11l2.5 2.5"/>
        </svg>
      </div>
      <input id="srch-inp" type="text" placeholder="Search…" oninput="onSearch(this)"/>
      <button class="srch-clear" id="srch-clear" onclick="clearSearch()">×</button>
    </div>

    <!-- Filter buttons -->
    <div class="flt-group">

      <!-- Account filter -->
      <div style="position:relative">
        <button class="flt-btn" id="fb-acc" onclick="toggleDD('dd-acc',this)">
          <span class="act-dot"></span>
          Account
          <span class="chv">▾</span>
        </button>
        <div class="dd" id="dd-acc">
          <div class="dd-srch"><input type="text" placeholder="Search accounts…" oninput="filterDD('dd-acc',this.value)"/></div>
          <div class="dd-list" id="ddl-acc"></div>
          <div class="dd-foot">
            <span class="dd-sel-count" id="ddc-acc">0 selected</span>
            <button class="dd-clear" onclick="clearFlt('acc')">Clear</button>
          </div>
        </div>
      </div>

      <!-- Cost Centre filter -->
      <div style="position:relative">
        <button class="flt-btn" id="fb-cc" onclick="toggleDD('dd-cc',this)">
          <span class="act-dot"></span>
          Cost Centre
          <span class="chv">▾</span>
        </button>
        <div class="dd" id="dd-cc">
          <div class="dd-srch"><input type="text" placeholder="Search cost centres…" oninput="filterDD('dd-cc',this.value)"/></div>
          <div class="dd-list" id="ddl-cc"></div>
          <div class="dd-foot">
            <span class="dd-sel-count" id="ddc-cc">0 selected</span>
            <button class="dd-clear" onclick="clearFlt('cc')">Clear</button>
          </div>
        </div>
      </div>

      <!-- Clear all -->
      <button class="clear-all-btn" onclick="clearAll()">
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M9 3L3 9M3 3l6 6"/></svg>
        Clear all
      </button>
    </div>
  </div>

  <!-- ACTIVE FILTER TAGS -->
  <div class="tags-row" id="tags-row"></div>

  <!-- TABLE HEADER -->
  <div class="tbl-head" id="tbl-head">
    <div class="th" onclick="sortBy('acc_no')" id="th-acc_no">
      <span>Account No</span>
      <span class="sort-ic" id="si-acc_no">
        <svg viewBox="0 0 8 5"><path d="M1 4l3-3 3 3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" fill="none"/></svg>
        <svg viewBox="0 0 8 5"><path d="M1 1l3 3 3-3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" fill="none"/></svg>
      </span>
    </div>
    <div class="th" onclick="sortBy('date')" id="th-date">
      <span>Date</span>
      <span class="sort-ic" id="si-date">
        <svg viewBox="0 0 8 5"><path d="M1 4l3-3 3 3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" fill="none"/></svg>
        <svg viewBox="0 0 8 5"><path d="M1 1l3 3 3-3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" fill="none"/></svg>
      </span>
    </div>
    <div class="th r" onclick="sortBy('amount')" id="th-amount">
      <span>Amount</span>
      <span class="sort-ic" id="si-amount">
        <svg viewBox="0 0 8 5"><path d="M1 4l3-3 3 3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" fill="none"/></svg>
        <svg viewBox="0 0 8 5"><path d="M1 1l3 3 3-3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" fill="none"/></svg>
      </span>
    </div>
    <div class="th" onclick="sortBy('cost_center')" id="th-cost_center">
      <span>Cost Centre</span>
      <span class="sort-ic" id="si-cost_center">
        <svg viewBox="0 0 8 5"><path d="M1 4l3-3 3 3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" fill="none"/></svg>
        <svg viewBox="0 0 8 5"><path d="M1 1l3 3 3-3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" fill="none"/></svg>
      </span>
    </div>
    <div class="th" onclick="sortBy('reason')" id="th-reason">
      <span>Reason</span>
      <span class="sort-ic" id="si-reason">
        <svg viewBox="0 0 8 5"><path d="M1 4l3-3 3 3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" fill="none"/></svg>
        <svg viewBox="0 0 8 5"><path d="M1 1l3 3 3-3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" fill="none"/></svg>
      </span>
    </div>
  </div>

  <!-- TABLE BODY -->
  <div class="tbl-body" id="tbl-body">
    <div id="loading-state">
      <div class="spinner"></div>
      <div class="loading-txt">Loading transactions…</div>
    </div>
    <div id="empty-state" style="display:none">
      <div class="emp-icon">🔍</div>
      <div class="emp-txt">No matching transactions</div>
      <div class="emp-sub">Try adjusting your filters or search term</div>
    </div>
  </div>

  <!-- FOOTER -->
  <div class="ftr">
    <div class="ftr-l">
      <div class="ftr-stat">Showing <b id="f-show">—</b> of <b id="f-tot">—</b></div>
      <div class="ftr-stat">Total: <b id="f-sum">—</b></div>
    </div>
    <div class="ftr-hint">Click header to sort · Click row to highlight</div>
  </div>

</div>
</div>
<script>
'use strict';
(function(){

/* ── column layout ── */
document.documentElement.style.setProperty('--tcols','130px 100px 120px 110px 1fr');

var $=function(id){return document.getElementById(id);};

/* ── state ── */
var ALL=[]; /* processed rows */
var sortCol='date', sortDir='desc';
var srchTxt='';
var selAcc=new Set(), selCC=new Set();
var selRow=-1;

/* open dropdown id */
var openDD=null;

/* ════════════════════════════════
   HELPERS
════════════════════════════════ */
function fmtN(n){
  if(n===null||n===undefined||isNaN(n)) return '—';
  var abs=Math.abs(n),s=n<0?'-':'';
  if(abs>=1e9) return s+(abs/1e9).toFixed(2)+' B';
  if(abs>=1e6) return s+(abs/1e6).toFixed(2)+' M';
  if(abs>=1e3) return s+(abs/1e3).toFixed(1)+' K';
  return s+abs.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function escH(s){
  return String(s===null||s===undefined?'—':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ════════════════════════════════
   DROPDOWN MANAGEMENT
════════════════════════════════ */
window.toggleDD=function(ddId,btn){
  var dd=$(ddId);
  if(openDD&&openDD!==ddId){
    $(openDD).classList.remove('open');
    var prevBtn=document.querySelector('[onclick*="'+openDD+'"]');
    if(prevBtn) prevBtn.classList.remove('open');
  }
  var isOpen=dd.classList.toggle('open');
  btn.classList.toggle('open',isOpen);
  openDD=isOpen?ddId:null;
  if(isOpen){
    /* focus search input */
    var si=dd.querySelector('.dd-srch input');
    if(si){si.value='';si.focus();filterDD(ddId,'');}
  }
};

/* close dropdowns when clicking outside */
document.addEventListener('mousedown',function(e){
  if(openDD&&!$(openDD).contains(e.target)&&!e.target.closest('.flt-btn')){
    $(openDD).classList.remove('open');
    var allBtns=document.querySelectorAll('.flt-btn.open');
    allBtns.forEach(function(b){b.classList.remove('open');});
    openDD=null;
  }
});

/* filter items within dropdown */
window.filterDD=function(ddId,q){
  var listId=ddId==='dd-acc'?'ddl-acc':'ddl-cc';
  var items=$(listId).querySelectorAll('.dd-item');
  var qlo=q.toLowerCase().trim();
  items.forEach(function(it){
    var lbl=it.querySelector('.dd-label');
    it.style.display=(!qlo||lbl.textContent.toLowerCase().indexOf(qlo)>=0)?'flex':'none';
  });
};

/* ════════════════════════════════
   BUILD DROPDOWN LISTS
════════════════════════════════ */
function buildDropdowns(){
  /* count occurrences */
  var accCnt={}, ccCnt={};
  ALL.forEach(function(r){
    if(r.acc_no) accCnt[r.acc_no]=(accCnt[r.acc_no]||0)+1;
    if(r.cost_center) ccCnt[r.cost_center]=(ccCnt[r.cost_center]||0)+1;
  });

  fillDD('ddl-acc', Object.keys(accCnt).sort(), accCnt, selAcc, 'acc');
  fillDD('ddl-cc',  Object.keys(ccCnt).sort(),  ccCnt,  selCC,  'cc');
  updateSelCounts();
}

function fillDD(listId, keys, cnts, selSet, type){
  var el=$(listId);
  el.innerHTML='';
  var frag=document.createDocumentFragment();
  keys.forEach(function(key){
    var item=document.createElement('div');
    item.className='dd-item'+(selSet.has(key)?' checked':'');
    item.dataset.val=key;
    item.innerHTML=
      '<div class="dd-cb">'+
        '<svg viewBox="0 0 10 8" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+
          '<path d="M1.5 4L4 6.5L8.5 1.5"/>'+
        '</svg>'+
      '</div>'+
      '<span class="dd-label">'+escH(key)+'</span>'+
      '<span class="dd-count">'+cnts[key]+'</span>';
    item.addEventListener('mousedown',function(e){
      e.preventDefault();
      if(selSet.has(key)) selSet.delete(key);
      else selSet.add(key);
      item.classList.toggle('checked',selSet.has(key));
      updateFltBtn(type);
      updateSelCounts();
      updateTags();
      renderTable();
    });
    frag.appendChild(item);
  });
  el.appendChild(frag);
}

function updateSelCounts(){
  $('ddc-acc').textContent=selAcc.size?selAcc.size+' selected':'All accounts';
  $('ddc-cc').textContent=selCC.size?selCC.size+' selected':'All cost ctrs';
}

function updateFltBtn(type){
  var btn=$(type==='acc'?'fb-acc':'fb-cc');
  var set=type==='acc'?selAcc:selCC;
  btn.classList.toggle('active',set.size>0);
}

/* ════════════════════════════════
   ACTIVE FILTER TAGS
════════════════════════════════ */
function updateTags(){
  var row=$('tags-row');
  row.innerHTML='';
  selAcc.forEach(function(v){
    var t=document.createElement('div');
    t.className='tag';
    t.innerHTML=escH(v)+' <button class="tag-x" onclick="removeAcc(\''+escH(v).replace(/'/g,"\\'")+'\')" >×</button>';
    row.appendChild(t);
  });
  selCC.forEach(function(v){
    var t=document.createElement('div');
    t.className='tag cc';
    t.innerHTML=escH(v)+' <button class="tag-x" onclick="removeCC(\''+escH(v).replace(/'/g,"\\'")+'\')" >×</button>';
    row.appendChild(t);
  });
}

window.removeAcc=function(v){
  selAcc.delete(v);
  /* uncheck in list */
  var items=$('ddl-acc').querySelectorAll('.dd-item');
  items.forEach(function(it){if(it.dataset.val===v)it.classList.remove('checked');});
  updateFltBtn('acc');updateSelCounts();updateTags();renderTable();
};
window.removeCC=function(v){
  selCC.delete(v);
  var items=$('ddl-cc').querySelectorAll('.dd-item');
  items.forEach(function(it){if(it.dataset.val===v)it.classList.remove('checked');});
  updateFltBtn('cc');updateSelCounts();updateTags();renderTable();
};

/* clear per column */
window.clearFlt=function(type){
  if(type==='acc'){
    selAcc.clear();
    $('ddl-acc').querySelectorAll('.dd-item').forEach(function(it){it.classList.remove('checked');});
    updateFltBtn('acc');
  } else {
    selCC.clear();
    $('ddl-cc').querySelectorAll('.dd-item').forEach(function(it){it.classList.remove('checked');});
    updateFltBtn('cc');
  }
  updateSelCounts();updateTags();renderTable();
};

/* ════════════════════════════════
   SEARCH
════════════════════════════════ */
window.onSearch=function(inp){
  srchTxt=inp.value.toLowerCase().trim();
  $('srch-clear').classList.toggle('vis',srchTxt.length>0);
  renderTable();
};
window.clearSearch=function(){
  $('srch-inp').value='';srchTxt='';
  $('srch-clear').classList.remove('vis');
  renderTable();
};

/* ════════════════════════════════
   CLEAR ALL
════════════════════════════════ */
window.clearAll=function(){
  selAcc.clear();selCC.clear();srchTxt='';selRow=-1;
  $('srch-inp').value='';$('srch-clear').classList.remove('vis');
  document.querySelectorAll('.dd-item.checked').forEach(function(it){it.classList.remove('checked');});
  updateFltBtn('acc');updateFltBtn('cc');
  updateSelCounts();updateTags();renderTable();
};

/* ════════════════════════════════
   SORT
════════════════════════════════ */
window.sortBy=function(col){
  if(sortCol===col) sortDir=sortDir==='asc'?'desc':'asc';
  else{sortCol=col;sortDir=(col==='date'||col==='amount')?'desc':'asc';}
  updateSortIcons();renderTable();
};
function updateSortIcons(){
  ['acc_no','date','amount','cost_center','reason'].forEach(function(c){
    var th=$('th-'+c), si=$('si-'+c);
    if(!th||!si) return;
    th.classList.toggle('sorted',c===sortCol);
    if(c===sortCol){
      si.children[0].style.opacity=sortDir==='asc'?'1':'0.15';
      si.children[1].style.opacity=sortDir==='desc'?'1':'0.15';
    } else {
      si.children[0].style.opacity='0.35';
      si.children[1].style.opacity='0.35';
    }
  });
}

/* ════════════════════════════════
   FILTER + SORT
════════════════════════════════ */
function getFiltered(){
  return ALL.filter(function(r){
    if(selAcc.size&&!selAcc.has(r.acc_no)) return false;
    if(selCC.size&&!selCC.has(r.cost_center)) return false;
    if(srchTxt){
      var hay=[(r.acc_no||''),(r.date||''),(r.cost_center||''),(r.reason||''),String(r.amount||'')].join('|').toLowerCase();
      if(hay.indexOf(srchTxt)<0) return false;
    }
    return true;
  });
}
function sortRows(rows){
  return rows.slice().sort(function(a,b){
    var dir=sortDir==='asc'?1:-1;
    var av,bv;
    if(sortCol==='date'){av=a._ds;bv=b._ds;}
    else if(sortCol==='amount'){av=a.amount===null?-Infinity:a.amount;bv=b.amount===null?-Infinity:b.amount;}
    else{av=String(a[sortCol]||'');bv=String(b[sortCol]||'');}
    if(typeof av==='number'&&typeof bv==='number') return(av-bv)*dir;
    return String(av).localeCompare(String(bv))*dir;
  });
}

/* ════════════════════════════════
   RENDER TABLE
════════════════════════════════ */
function renderTable(){
  var body=$('tbl-body');
  /* remove old rows */
  body.querySelectorAll('.tr').forEach(function(r){r.remove();});
  $('loading-state').style.display='none';

  var filtered=sortRows(getFiltered());

  if(!filtered.length){
    $('empty-state').style.display='flex';
    $('tb-count').textContent='0 rows';
    $('f-show').textContent='0';
    $('f-tot').textContent=ALL.length.toLocaleString('en-US');
    $('f-sum').textContent='—';
    return;
  }
  $('empty-state').style.display='none';

  var frag=document.createDocumentFragment();
  var total=0;

  filtered.forEach(function(row,i){
    var tr=document.createElement('div');
    tr.className='tr'+(i===selRow?' selected':'');
    tr.dataset.i=i;

    var amtCls=row.amount===null?'amt-zero':row.amount>0?'amt-pos':row.amount<0?'amt-neg':'amt-zero';
    var amtTxt=row.amount!==null?fmtN(row.amount):'—';
    if(row.amount!==null) total+=row.amount;

    tr.innerHTML=
      '<div class="td"><span class="acc-pill">'+escH(row.acc_no)+'</span></div>'+
      '<div class="td td-date">'+escH(row.date)+'</div>'+
      '<div class="td r"><span class="'+amtCls+'">'+escH(amtTxt)+'</span></div>'+
      '<div class="td"><span class="cc-pill">'+escH(row.cost_center)+'</span></div>'+
      '<div class="td"><span class="td-reason" title="'+escH(row.reason||'')+'">'+escH(row.reason||'—')+'</span></div>';

    tr.addEventListener('click',function(){
      selRow=selRow===i?-1:i;
      body.querySelectorAll('.tr').forEach(function(r,ri){
        r.classList.toggle('selected',ri===selRow);
      });
    });

    /* stagger entry animation */
    tr.style.animationDelay=Math.min(i*8,120)+'ms';
    frag.appendChild(tr);
  });

  body.appendChild(frag);

  /* update footer + header count */
  $('tb-count').textContent=filtered.length.toLocaleString('en-US')+' rows';
  $('f-show').textContent=filtered.length.toLocaleString('en-US');
  $('f-tot').textContent=ALL.length.toLocaleString('en-US');
  $('f-sum').textContent=fmtN(total);
}

/* ════════════════════════════════
   CONFIRMED WORKING DATA READER
════════════════════════════════ */
async function getData(ws){
  var rows=[],rdr=await ws.getSummaryDataReaderAsync(undefined,{ignoreSelection:true});
  for(var i=0;i<rdr.pageCount;i++){
    var pg=await rdr.getPageAsync(i);
    pg.data.forEach(function(r){
      var row={};pg.columns.forEach(function(c,idx){row[c.fieldName]=r[idx];});rows.push(row);
    });
  }
  await rdr.releaseAsync();return rows;
}
async function getEnc(ws){
  var spec=await ws.getVisualSpecificationAsync(),map={};
  if(spec.activeMarksSpecificationIndex<0) return map;
  spec.marksSpecifications[spec.activeMarksSpecificationIndex]
      .encodings.forEach(function(e){map[e.id]=e.field;});
  return map;
}

/* ── field resolution ── */
function findKey(ef,rk){
  if(!ef) return null;
  var nm=ef.name.toLowerCase();
  for(var i=0;i<rk.length;i++) if(rk[i].toLowerCase()===nm) return rk[i];
  return null;
}
function autoFind(rk,used,pats){
  for(var pi=0;pi<pats.length;pi++)
    for(var ki=0;ki<rk.length;ki++){
      if(used.indexOf(rk[ki])>=0) continue;
      if(rk[ki].toLowerCase().indexOf(pats[pi])>=0) return rk[ki];
    }
  return null;
}

/* ── safe string reader — FIXES cost_center showing 0 ──
   cost_center is a DIMENSION so read formattedValue first,
   never fall through to nativeValue which may be a numeric code */
function dvStr(row,k){
  if(!k||!row[k]) return null;
  var dv=row[k];
  /* formattedValue is always correct for dimensions */
  var fv=(dv.formattedValue!==undefined&&dv.formattedValue!==null)?String(dv.formattedValue).trim():'';
  if(fv&&fv!=='%null%'&&fv!=='Null'&&fv!=='null') return fv;
  /* fallback value field (string dimensions) */
  var vv=(dv.value!==undefined&&dv.value!==null)?String(dv.value).trim():'';
  if(vv&&vv!=='%null%'&&vv!=='Null'&&vv!=='null'&&vv!=='0') return vv;
  return null;
}
function dvNum(row,k){
  if(!k||!row[k]) return null;
  var dv=row[k];
  var raw=dv.nativeValue!==undefined&&dv.nativeValue!==null?dv.nativeValue:dv.value;
  var n=parseFloat(raw);return isNaN(n)?null:n;
}
function dvDateSort(row,k){
  if(!k||!row[k]) return 0;
  var dv=row[k];
  var nv=dv.nativeValue!==undefined?dv.nativeValue:dv.value;
  if(typeof nv==='number'&&nv>1e10) return nv;
  if(typeof nv==='number') return nv;
  var fv=(dv.formattedValue||'').trim();
  var d=new Date(fv);return isNaN(d.getTime())?0:d.getTime();
}

/* ── process ── */
function processData(raw,enc){
  if(!raw.length) return[];
  var rk=Object.keys(raw[0]);
  var aK=findKey(enc.acc_no,     rk);
  var dK=findKey(enc.date,       rk);
  var mK=findKey(enc.amount,     rk);
  var cK=findKey(enc.cost_center,rk);
  var used=[aK,dK,mK,cK].filter(Boolean);
  /* auto-detect reason from Detail */
  var rK=autoFind(rk,used,['reason','description','desc','narration','remark','note','memo']);
  if(!aK) aK=autoFind(rk,used,['account_no','accountno','account','acct']);
  if(!dK) dK=autoFind(rk,used,['posting_date','post_date','tran_date','date','trans_date']);
  if(!mK) mK=autoFind(rk,used,['amount','amt','balance','bal','value','debit','credit']);
  if(!cK) cK=autoFind(rk,used,['cost_center','costcenter','cost_centre','cost centre','cc']);

  return raw.map(function(row){
    return{
      acc_no:      dvStr(row,aK)||'—',
      date:        dvStr(row,dK)||'—',
      _ds:         dvDateSort(row,dK),
      amount:      dvNum(row,mK),
      cost_center: dvStr(row,cK)||'—',  /* fixed: uses dvStr, never nativeValue for dimensions */
      reason:      dvStr(row,rK)||'—'
    };
  });
}

/* ── render with data ── */
function render(raw,enc){
  ALL=processData(raw,enc);
  selRow=-1;
  buildDropdowns();
  updateSortIcons();
  renderTable();
}

/* ════════════════════════════════
   CONFIRMED WORKING INIT
════════════════════════════════ */
window.onload=tableau.extensions.initializeAsync().then(function(){
  var ws=tableau.extensions.worksheetContent.worksheet;
  var update=async function(){
    $('loading-state').style.display='flex';
    $('empty-state').style.display='none';
    var data=await getData(ws);
    var enc =await getEnc(ws);
    render(data,enc);
  };
  ws.addEventListener(tableau.TableauEventType.SummaryDataChanged,update);
  update();
});

})();
</script>
</body>
</html>
